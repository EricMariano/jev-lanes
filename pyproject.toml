[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-lanes"
version = "0.1.0rc1"
description = "Confidence-based routing and escalation policies for Jev and LangGraph."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jev", "typesafe", "langgraph", "routing", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2.12,<2",
    "langchain>=1.3.15,<2",
    "langchain-core>=1.6.2,<2",
    "langchain-typesafe>=0.0.1a3,<0.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
# Provider package for the opt-in live tests; end users install their own provider.
live = ["langchain-openai>=1,<2"]
notebook = ["ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6"]

[project.urls]
Repository = "https://github.com/EricMariano/jev-lanes"
Issues = "https://github.com/EricMariano/jev-lanes/issues"
Changelog = "https://github.com/EricMariano/jev-lanes/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_lanes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["live: calls real services with your own keys; run with JEV_RUN_LIVE=1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Case texts and report strings are data; wrapping them would hurt readability.
"benchmarks/*.py" = ["E501"]
